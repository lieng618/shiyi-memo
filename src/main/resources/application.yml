server:
  port: 8080
  # Nginx 反代时用来还原真实 IP / 协议
  forward-headers-strategy: native
  compression:
    enabled: true
    min-response-size: 1024
    mime-types: application/json,text/plain,text/css,text/html,application/javascript
  tomcat:
    # 允许大文件上传，超限时也要把请求体读完，避免连接被重置
    max-swallow-size: -1
    max-http-form-post-size: -1

spring:
  application:
    name: shiyi-memo
  profiles:
    active: local
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/shiyi_memo?useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&rewriteBatchedStatements=true
    username: shiyi_memo
    password: change-me
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 10000
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  servlet:
    multipart:
      enabled: true
      # 单文件上限，真正的业务上限由用户等级决定（见 app.storage）
      max-file-size: 2GB
      max-request-size: 2GB
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
    time-zone: Asia/Shanghai
  mail:
    host: smtp.qq.com
    port: 465
    username: ""
    password: ""
    default-encoding: UTF-8
    properties:
      mail:
        smtp:
          auth: true
          ssl:
            enable: true
          connectiontimeout: 10000
          timeout: 10000
          writetimeout: 10000

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
    db-config:
      id-type: auto

app:
  # 站点对外地址，用于邮件正文里的链接
  base-url: http://localhost:8080
  jwt:
    # 生产环境务必通过环境变量覆盖，长度至少 32 字节
    secret: "dev-only-secret-please-change-me-0123456789"
    ttl-hours: 168
    cookie-name: MEMO_TOKEN
    # 挂上 HTTPS 之后改成 true
    secure-cookie: false
  admin:
    # 后台控制台账号（独立站点 /admin），和备忘录用户无关；公网部署务必改掉
    username: admin
    password: change-me
    cookie-name: MEMO_ADMIN_TOKEN
    ttl-hours: 12
  storage:
    root: ./data/uploads
    thumbnail-root: ./data/thumbnails
    # 缩略图长边像素
    thumbnail-max-size: 480
  mail:
    # 配好邮箱授权码后改成 true，验证码就会真正发信
    enabled: false
    from: ""
    code-ttl-minutes: 10
    # 邮件服务未启用时，验证码直接由接口返回并写入日志，方便本地联调；公网部署请设为 false
    expose-code: true
    resend-interval-seconds: 60
    daily-limit-per-email: 30
  security:
    # 是否允许新邮箱自助注册（首次验证码登录即建号）
    allow-register: true
    default-level-code: free
  desktop:
    # 安装包下载地址（Gitee 发行版的固定地址）；留空则网页不显示桌面端入口
    download-url: ""

logging:
  level:
    org.shiyi.memo: info
  file:
    name: ./logs/shiyi-memo.log
  logback:
    rollingpolicy:
      max-file-size: 20MB
      max-history: 14
